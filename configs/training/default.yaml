# Manuscript Table 3. batch_size_per_gpu * grad_accum_steps = 32 is the SINGLE-process effective
# batch size; on 2 data-parallel GPUs the global value is 64 (known_discrepancies.md, H).
optimizer: adamw
lr_lora: 1.0e-4
lr_new: 1.0e-5
lr_backbone: 0.0
weight_decay: 0.01
betas: [0.9, 0.999]
warmup_epochs: 5
epochs: 100
min_lr: 1.0e-7
batch_size_per_gpu: 16
grad_accum_steps: 2
grad_clip: 1.0
amp: true
early_stopping_patience: 15
seed: 42
num_workers: 4
sampler_weights: neg_over_pos   # derived from training labels (8.40 for 6000/714); manuscript's 4.50 is stale
loss: {weights: [1.0, 0.3, 0.3], kl_anneal_epochs: 10, nll_type: log}
