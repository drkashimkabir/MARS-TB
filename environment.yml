name: mars-tb
channels:
  - pytorch
  - conda-forge
dependencies:
  - python=3.10
  - pytorch>=2.1
  - torchvision>=0.16
  - numpy>=1.24,<2
  - scipy
  - pandas
  - pillow
  - pyyaml
  - jsonschema
  - matplotlib
  - pip
  - pip:
      - opencv-python-headless>=4.8,<4.12
      - pydicom
      - -e .
