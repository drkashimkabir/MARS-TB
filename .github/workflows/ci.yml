name: ci
# NOT RUN in the environment where this repository was prepared; verify the first run after publishing.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (CPU PyTorch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: python -m mypy
      - name: Tests with coverage
        run: python -m pytest -m "not slow" --cov --cov-report=xml --cov-fail-under=80
      - name: Artifact validation
        run: python scripts/validate_artifacts.py
  slow:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -e ".[dev]"
      - run: python -m pytest -m slow
