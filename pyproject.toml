[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mars-tb"
version = "0.1.0"
description = "Manuscript-derived reference implementation of MARS-TB (multi-scale vision-language and anatomical graph reasoning for TB detection on chest radiographs)"
readme = "README.md"
requires-python = ">=3.10"
# No licence is declared on purpose: see docs/licensing_status.md.
dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "opencv-python-headless>=4.8",
  "pillow>=10.0",
  "pyyaml>=6.0",
  "jsonschema>=4.17",
  "matplotlib>=3.7",
  "pydicom>=2.4",
]

[project.optional-dependencies]
text = ["transformers>=4.40"]
timm = ["timm>=0.9"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  "pandas-stubs",
  "pip-audit",
  "bandit",
  "timm>=0.9",
  "scikit-learn>=1.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mars_tb = ["resources/*.yaml", "resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "slow: full-resolution (512x512, ViT-B/16) tests, run with -m slow",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/mars_tb"]
omit = ["src/mars_tb/training/distributed.py"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "B905", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "E501"]
"scripts/*" = ["S603", "S607", "E501"]
"reporting/*" = ["S", "E501"]
"src/mars_tb/audit.py" = ["E501"]  # long human-readable finding messages

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
files = ["src/mars_tb"]
